<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#141c2e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e5b842"/>
      <stop offset="100%" stop-color="#f3d179"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="rose" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="40" y="40" width="1120" height="550" rx="16" fill="#111827" stroke="#1f2937" stroke-width="2"/>
  
  <text x="80" y="90" font-family="'Montserrat', sans-serif" font-weight="900" font-size="28" fill="url(#gold)">RAMJI247 SPORT • EDITORIAL INSIGHTS</text>
  <text x="80" y="130" font-family="'Montserrat', sans-serif" font-weight="800" font-size="34" fill="#ffffff">Market Architecture: Sports Exchange vs Traditional Bookmaker</text>
  <text x="80" y="160" font-family="'Poppins', sans-serif" font-size="16" fill="#9ca3af">Direct peer-to-peer order execution vs centralized bookmaker vigorish margin models.</text>

  <!-- Left: Bookmaker Model -->
  <rect x="80" y="200" width="490" height="340" rx="12" fill="#182234" stroke="#e11d48" stroke-width="1.5"/>
  <rect x="100" y="220" width="180" height="30" rx="6" fill="#e11d48" fill-opacity="0.2"/>
  <text x="110" y="240" font-family="'Montserrat', sans-serif" font-weight="700" font-size="14" fill="#fb7185">TRADITIONAL BOOKMAKER</text>
  <text x="100" y="280" font-family="'Poppins', sans-serif" font-weight="600" font-size="18" fill="#ffffff">Player vs Centralized House</text>
  
  <rect x="100" y="310" width="450" height="65" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="120" y="338" font-family="'Poppins', sans-serif" font-size="14" fill="#94a3b8">Bettor places Back order ➔ House sets unfavorable odds</text>
  <text x="120" y="360" font-family="'Poppins', sans-serif" font-weight="700" font-size="13" fill="#fb7185">Built-in Vig Margin: 5% to 12% profit deduction</text>
  
  <rect x="100" y="390" width="450" height="65" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="120" y="418" font-family="'Poppins', sans-serif" font-size="14" fill="#94a3b8">Account restrictions on consistent winning punters</text>
  <text x="120" y="440" font-family="'Poppins', sans-serif" font-size="13" fill="#ef4444">Zero ability to act as the layer (sell odds)</text>

  <!-- Right: Exchange Model -->
  <rect x="630" y="200" width="490" height="340" rx="12" fill="#182234" stroke="#e5b842" stroke-width="1.5"/>
  <rect x="650" y="220" width="220" height="30" rx="6" fill="#e5b842" fill-opacity="0.2"/>
  <text x="660" y="240" font-family="'Montserrat', sans-serif" font-weight="700" font-size="14" fill="#f3d179">RAMJI247 SPORTS EXCHANGE</text>
  <text x="650" y="280" font-family="'Poppins', sans-serif" font-weight="600" font-size="18" fill="#ffffff">Peer-to-Peer Back &amp; Lay Liquidity</text>

  <rect x="650" y="310" width="450" height="65" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="670" y="338" font-family="'Poppins', sans-serif" font-size="14" fill="#94a3b8">Backer buys outcome (Blue) ➔ Layer sells outcome (Pink)</text>
  <text x="670" y="360" font-family="'Poppins', sans-serif" font-weight="700" font-size="13" fill="#10b981">Zero Vigorish: Pure market-driven 100% fair book</text>

  <rect x="650" y="390" width="450" height="65" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="670" y="418" font-family="'Poppins', sans-serif" font-size="14" fill="#94a3b8">Winners welcomed; 2% commission only on net winnings</text>
  <text x="670" y="440" font-family="'Poppins', sans-serif" font-size="13" fill="#60a5fa">In-Play Green Book hedging &amp; arbitrage trading</text>
</svg>