<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#0b1120"/>
  <rect x="20" y="20" width="760" height="410" rx="12" fill="#131c31" stroke="#1e293b"/>
  <text x="50" y="60" font-family="'Montserrat', sans-serif" font-weight="800" font-size="22" fill="#e5b842">Backing vs Laying: Mechanics of Exchange Positions</text>
  <text x="50" y="88" font-family="'Poppins', sans-serif" font-size="14" fill="#94a3b8">Understanding the difference between betting for and betting against an outcome.</text>

  <!-- Back Box -->
  <rect x="50" y="120" width="330" height="270" rx="10" fill="#1e3a8a" fill-opacity="0.3" stroke="#3b82f6" stroke-width="2"/>
  <rect x="70" y="140" width="100" height="28" rx="6" fill="#3b82f6"/>
  <text x="85" y="160" font-family="'Montserrat', sans-serif" font-weight="800" font-size="14" fill="#ffffff">BACK (BLUE)</text>
  <text x="70" y="200" font-family="'Poppins', sans-serif" font-weight="600" font-size="16" fill="#ffffff">Betting FOR an outcome to happen</text>
  <text x="70" y="235" font-family="'Poppins', sans-serif" font-size="14" fill="#cbd5e1">• You act as the buyer of odds</text>
  <text x="70" y="265" font-family="'Poppins', sans-serif" font-size="14" fill="#cbd5e1">• Maximum Loss: Exact Stake amount</text>
  <text x="70" y="295" font-family="'Poppins', sans-serif" font-size="14" fill="#cbd5e1">• Potential Profit: Stake × (Odds - 1)</text>
  <rect x="70" y="325" width="290" height="45" rx="6" fill="#0f172a"/>
  <text x="85" y="352" font-family="'Poppins', sans-serif" font-weight="600" font-size="13" fill="#60a5fa">Example: Back ₹1,000 @ 2.50 ➔ Profit ₹1,500</text>

  <!-- Lay Box -->
  <rect x="420" y="120" width="330" height="270" rx="10" fill="#881337" fill-opacity="0.3" stroke="#f43f5e" stroke-width="2"/>
  <rect x="440" y="140" width="90" height="28" rx="6" fill="#f43f5e"/>
  <text x="458" y="160" font-family="'Montserrat', sans-serif" font-weight="800" font-size="14" fill="#ffffff">LAY (PINK)</text>
  <text x="440" y="200" font-family="'Poppins', sans-serif" font-weight="600" font-size="16" fill="#ffffff">Betting AGAINST an outcome to happen</text>
  <text x="440" y="235" font-family="'Poppins', sans-serif" font-size="14" fill="#cbd5e1">• You act as the bookmaker/seller</text>
  <text x="440" y="265" font-family="'Poppins', sans-serif" font-size="14" fill="#cbd5e1">• Maximum Profit: Backer's Stake</text>
  <text x="440" y="295" font-family="'Poppins', sans-serif" font-size="14" fill="#cbd5e1">• Potential Loss (Liability): Stake × (Odds - 1)</text>
  <rect x="440" y="325" width="290" height="45" rx="6" fill="#0f172a"/>
  <text x="455" y="352" font-family="'Poppins', sans-serif" font-weight="600" font-size="13" fill="#fb7185">Example: Lay ₹1,000 @ 2.50 ➔ Liability ₹1,500</text>
</svg>