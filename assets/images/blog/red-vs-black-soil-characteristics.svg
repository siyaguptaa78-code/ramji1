<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <rect width="800" height="420" fill="#0b1120"/>
  <text x="40" y="45" font-family="'Montserrat', sans-serif" font-weight="800" font-size="20" fill="#e5b842">Soil Composition Breakdown: Red vs Black Clay Pitch</text>
  <text x="40" y="70" font-family="'Poppins', sans-serif" font-size="13" fill="#94a3b8">Comparative behavioral profile of prominent subcontinental pitches.</text>

  <!-- Red Soil -->
  <rect x="40" y="95" width="345" height="290" rx="10" fill="#1e1814" stroke="#c2410c" stroke-width="2"/>
  <rect x="60" y="115" width="180" height="28" rx="6" fill="#ea580c"/>
  <text x="75" y="134" font-family="'Montserrat', sans-serif" font-weight="800" font-size="13" fill="#ffffff">RED CLAY (MUMBAI/CHENNAI)</text>
  <text x="60" y="175" font-family="'Poppins', sans-serif" font-weight="700" font-size="15" fill="#fdba74">• Fast Water Absorption / Rapid Drying</text>
  <text x="60" y="205" font-family="'Poppins', sans-serif" font-size="13" fill="#fed7aa">• Steep, bouncy carry for hit-the-deck pacers</text>
  <text x="60" y="235" font-family="'Poppins', sans-serif" font-size="13" fill="#fed7aa">• Breaks up earlier into powdery rough</text>
  <text x="60" y="265" font-family="'Poppins', sans-serif" font-size="13" fill="#fed7aa">• Sharp, fast spin (wrist spinners thrive)</text>
  <rect x="60" y="300" width="305" height="60" rx="6" fill="#2d1c15"/>
  <text x="75" y="325" font-family="'Poppins', sans-serif" font-weight="600" font-size="12" fill="#fb923c">Venue Examples: Wankhede, DY Patil</text>
  <text x="75" y="345" font-family="'Poppins', sans-serif" font-size="12" fill="#fdba74">Ideal for high-pace T20 strokeplay.</text>

  <!-- Black Soil -->
  <rect x="415" y="95" width="345" height="290" rx="10" fill="#111827" stroke="#4b5563" stroke-width="2"/>
  <rect x="435" y="115" width="190" height="28" rx="6" fill="#374151"/>
  <text x="450" y="134" font-family="'Montserrat', sans-serif" font-weight="800" font-size="13" fill="#ffffff">BLACK CLAY (AHMEDABAD/DELHI)</text>
  <text x="435" y="175" font-family="'Poppins', sans-serif" font-weight="700" font-size="15" fill="#93c5fd">• High Elasticity &amp; Moisture Retention</text>
  <text x="435" y="205" font-family="'Poppins', sans-serif" font-size="13" fill="#cbd5e1">• Low, spongy bounce as pitch ages</text>
  <text x="435" y="235" font-family="'Poppins', sans-serif" font-size="13" fill="#cbd5e1">• Rarely crumbles; holds together longer</text>
  <text x="435" y="265" font-family="'Poppins', sans-serif" font-size="13" fill="#cbd5e1">• Slower, grip-based turn for finger spinners</text>
  <rect x="435" y="300" width="305" height="60" rx="6" fill="#1f2937"/>
  <text x="450" y="325" font-family="'Poppins', sans-serif" font-weight="600" font-size="12" fill="#60a5fa">Venue Examples: Narendra Modi Stadium</text>
  <text x="450" y="345" font-family="'Poppins', sans-serif" font-size="12" fill="#93c5fd">Rewards precision cutters &amp; cross-seam.</text>
</svg>