<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" fill="#090d16"/>
  <text x="40" y="45" font-family="'Montserrat', sans-serif" font-weight="800" font-size="20" fill="#e5b842">T20 Inning Pacing &amp; Run-Rate Trajectory</text>
  <text x="40" y="70" font-family="'Poppins', sans-serif" font-size="13" fill="#94a3b8">Expected Run Rates across Powerplay, Consolidation, and Death Overs phases.</text>

  <!-- Powerplay -->
  <rect x="50" y="110" width="200" height="220" rx="8" fill="#1e293b" stroke="#3b82f6"/>
  <rect x="70" y="130" width="130" height="25" rx="4" fill="#3b82f6"/>
  <text x="80" y="147" font-family="'Montserrat', sans-serif" font-weight="700" font-size="12" fill="#ffffff">OVERS 1–6: POWERPLAY</text>
  <text x="70" y="190" font-family="'Montserrat', sans-serif" font-weight="900" font-size="32" fill="#60a5fa">8.8 RPO</text>
  <text x="70" y="220" font-family="'Poppins', sans-serif" font-size="13" fill="#cbd5e1">2 fielders outside 30-yd ring</text>
  <text x="70" y="245" font-family="'Poppins', sans-serif" font-size="13" fill="#cbd5e1">Hard new ball flies off bat</text>
  <text x="70" y="270" font-family="'Poppins', sans-serif" font-size="13" fill="#cbd5e1">Benchmark: 52–60 runs</text>

  <!-- Middle Overs -->
  <rect x="290" y="110" width="200" height="220" rx="8" fill="#1e293b" stroke="#f59e0b"/>
  <rect x="310" y="130" width="130" height="25" rx="4" fill="#f59e0b"/>
  <text x="318" y="147" font-family="'Montserrat', sans-serif" font-weight="700" font-size="12" fill="#000000">OVERS 7–15: MIDDLE</text>
  <text x="310" y="190" font-family="'Montserrat', sans-serif" font-weight="900" font-size="32" fill="#fbbf24">7.9 RPO</text>
  <text x="310" y="220" font-family="'Poppins', sans-serif" font-size="13" fill="#cbd5e1">5 fielders in deep boundary</text>
  <text x="310" y="245" font-family="'Poppins', sans-serif" font-size="13" fill="#cbd5e1">Spinners choke run flow</text>
  <text x="310" y="270" font-family="'Poppins', sans-serif" font-size="13" fill="#cbd5e1">Benchmark: 70–80 runs</text>

  <!-- Death Overs -->
  <rect x="530" y="110" width="220" height="220" rx="8" fill="#1e293b" stroke="#ef4444"/>
  <rect x="550" y="130" width="140" height="25" rx="4" fill="#ef4444"/>
  <text x="560" y="147" font-family="'Montserrat', sans-serif" font-weight="700" font-size="12" fill="#ffffff">OVERS 16–20: DEATH</text>
  <text x="550" y="190" font-family="'Montserrat', sans-serif" font-weight="900" font-size="32" fill="#f87171">12.4 RPO</text>
  <text x="550" y="220" font-family="'Poppins', sans-serif" font-size="13" fill="#cbd5e1">Maximum boundary targeting</text>
  <text x="550" y="245" font-family="'Poppins', sans-serif" font-size="13" fill="#cbd5e1">Yorkers vs Ramps / Scoops</text>
  <text x="550" y="270" font-family="'Poppins', sans-serif" font-size="13" fill="#cbd5e1">Benchmark: 58–75 runs</text>

  <text x="50" y="365" font-family="'Poppins', sans-serif" font-size="13" fill="#94a3b8">Total Typical Par Distribution: 55 + 75 + 65 = 195 runs in contemporary subcontinental conditions.</text>
</svg>